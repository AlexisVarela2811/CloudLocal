# Release — per-OS assets published to the GitHub Release.
#
# Triggered by pushing a tag v*. Each OS builds, verifies and smoke tests its
# own candidate, then the publish job attaches every zip + checksum to the
# GitHub Release for the tag. The candidate version comes from the tag:
# v0.2.0 -> 0.2.0-rc.1 (release.cjs requires X.Y.Z-rc.N).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    name: Assets (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64
          - os: macos-latest
            platform: darwin-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            launcher/package-lock.json

      - name: Install dependencies (root workspaces)
        run: npm ci

      - name: Install dependencies (launcher)
        run: npm ci --prefix launcher

      - name: Install Playwright Chromium (with system deps)
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Build frontend
        run: npm run build:frontend

      - name: Build native executable
        run: npm run build:exe

      - name: Resolve candidate version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}-rc.1" >> "$GITHUB_ENV"

      - name: Create release candidate
        shell: bash
        run: npm run release:candidate -- "$VERSION"

      - name: Verify release candidate
        shell: bash
        run: npm run release:verify -- "launcher/dist/release/$VERSION-${{ matrix.platform }}" --archive "launcher/dist/release/$VERSION-${{ matrix.platform }}.zip"

      - name: Smoke test the packaged candidate
        shell: bash
        run: npm run smoke:exe -- "launcher/dist/release/$VERSION-${{ matrix.platform }}"

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudlocal-${{ env.VERSION }}-${{ matrix.platform }}
          path: |
            launcher/dist/release/${{ env.VERSION }}-${{ matrix.platform }}.zip
            launcher/dist/release/${{ env.VERSION }}-${{ matrix.platform }}.zip.sha256
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    runs-on: ubuntu-latest
    needs: assets
    steps:
      # gh resolves the repository from the git checkout context.
      - uses: actions/checkout@v4

      - name: Download all candidate artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cloudlocal-*
          merge-multiple: true
          path: dist

      - name: Attach assets to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" --verify-tag --title "CloudLocal ${TAG#v}" \
            --generate-notes dist/*.zip dist/*.zip.sha256 \
          || gh release upload "$TAG" --clobber dist/*.zip dist/*.zip.sha256
          gh release view "$TAG" --json assets --jq '.assets[].name'
