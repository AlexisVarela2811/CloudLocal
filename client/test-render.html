<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FileVisual Test Harness</title>
  <style>
    .fa-spin { animation: spin 0.8s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .file-icon { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; }
    .file-icon svg { width: 14px; height: 14px; color: #94a3b8; }
    .file-icon img { width: 14px; height: 14px; object-fit: cover; border-radius: 2px; }
    #root { padding: 1rem; }
    .item { display: flex; gap: .5rem; align-items: center; margin-bottom: .5rem; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { FileVisual } from '/src/components/FileVisual.tsx';

    window.__loaded = [];
    var root = createRoot(document.getElementById('root'));

    // Render a list of items. Each item: { path, contentUrl, view? }
    window.__setItems = function (items) {
      window.__loaded.length = 0;
      root.render(
        React.createElement('div', { id: 'items' },
          items.map(function (item, index) {
            return React.createElement(
              'div',
              { className: 'item', 'data-testid': 'item-' + index, key: index },
              React.createElement(FileVisual, {
                path: item.path,
                contentUrl: item.contentUrl,
                view: item.view || 'list',
                className: 'file-icon',
                onLoaded: function () { window.__loaded.push(index); },
              }),
            );
          }),
        ),
      );
    };

    var params = new URLSearchParams(window.location.search);
    var raw = params.get('items');
    if (raw) {
      window.__setItems(JSON.parse(raw));
    } else {
      window.__setItems([{ path: params.get('p') || 'test.txt', contentUrl: params.get('c') || '', view: params.get('v') || 'list' }]);
    }
  </script>
</body>
</html>
